name: Build DotDial v2.2 Stable release APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DotDial_v2.2_scroll_performance_fixed_source.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded v2.2 source over the old checkout
        run: |
          SOURCE_ZIP="DotDial_v2.2_scroll_performance_fixed_source.zip"
          test -f "$SOURCE_ZIP" || { echo "::error::Upload $SOURCE_ZIP to the repository root first."; exit 1; }
          mkdir -p "$RUNNER_TEMP/dotdial-v22"
          unzip -oq "$SOURCE_ZIP" -d "$RUNNER_TEMP/dotdial-v22"
          test -f "$RUNNER_TEMP/dotdial-v22/app/build.gradle.kts"
          rm -rf app gradle
          cp -a "$RUNNER_TEMP/dotdial-v22/app" ./app
          cp -a "$RUNNER_TEMP/dotdial-v22/gradle" ./gradle
          cp "$RUNNER_TEMP/dotdial-v22/build.gradle.kts" ./build.gradle.kts
          cp "$RUNNER_TEMP/dotdial-v22/settings.gradle.kts" ./settings.gradle.kts
          cp "$RUNNER_TEMP/dotdial-v22/gradle.properties" ./gradle.properties
          cp "$RUNNER_TEMP/dotdial-v22/.env.example" ./.env.example
          grep -q 'composeBom = "2025.08.00"' gradle/libs.versions.toml
          grep -q 'versionCode = 8' app/build.gradle.kts
          grep -q 'versionName = "2.2"' app/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode permanent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dotdial-release.jks"
          test -s "$RUNNER_TEMP/dotdial-release.jks"
          # The source archive pins the alias to "upload"; use the permanent key alias.
          sed -i 's/keyAlias = "upload"/keyAlias = System.getenv("KEY_ALIAS") ?: "upload"/' app/build.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Install Android 16 QPR2 SDK (API 36.1)
        run: |
          for i in $(seq 1 30); do echo y; done | sdkmanager --licenses
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"

      - name: Build v2.2 release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/dotdial-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload v2.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Dot-Dial-v2.2-scroll-fixed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
