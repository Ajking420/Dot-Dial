name: Build DotDial optimized release APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-dotdial-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # One-off CI key for sideload testing. This is not a Play Store upload key.
      - name: Generate CI signing key
        run: >-
          keytool -genkeypair -v
          -keystore my-upload-key.jks
          -storepass dotdial-ci-only
          -alias upload
          -keypass dotdial-ci-only
          -keyalg RSA
          -keysize 2048
          -validity 10000
          -dname "CN=DotDial CI Build,O=DotDial,C=IN"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK 36.1
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Build optimized release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: dotdial-ci-only
          KEY_PASSWORD: dotdial-ci-only
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload optimized APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dot-Dial-optimized-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
